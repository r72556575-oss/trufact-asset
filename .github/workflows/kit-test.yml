name: kit-test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install engine dependencies
        working-directory: engine
        run: |
          npm init -y >/dev/null
          npm i playwright@1.49.1 three@0.160.0 >/dev/null 2>&1
          mkdir -p web/lib && cp node_modules/three/build/three.module.js web/lib/
          npx playwright install --with-deps chromium 2>&1 | tail -2
          node -v; nproc; free -g | head -2
      - name: Render 3 test frames
        working-directory: engine
        shell: bash
        run: |
          { echo "NODE: $(node -v) CPUS: $(nproc)"; node render.mjs stills "0,300,600" 1 0.9; } 2>&1 | tee ../kit_test.log
      - if: always()
        run: |
          git config user.name "trufact-bot"; git config user.email "bot@users.noreply.github.com"
          git add kit_test.log; git diff --cached --quiet || (git commit -m "kit test log" && git pull --rebase -q && git push)
