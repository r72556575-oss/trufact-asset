name: daily-short

on:
  schedule:
    - cron: "30 14 * * *"      # 20:00 IST every day; video goes public 07:00 IST next morning
  workflow_dispatch:
    inputs:
      skip_upload:
        description: "Test run: build the video but do NOT upload"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Make the video and schedule it
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAPIER_MCP_TOKEN: ${{ secrets.ZAPIER_MCP_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SKIP_UPLOAD: ${{ inputs.skip_upload && '1' || '0' }}
        run: python -u generate.py 2>&1 | tee run.log

      - name: Save log and topic history
        if: always()
        run: |
          git config user.name "trufact-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json run.log
          git diff --cached --quiet || (git commit -m "run log and topic history" && git pull --rebase -q && git push)
