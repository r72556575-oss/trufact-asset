name: daily-short

on:
  schedule:
    - cron: "30 21 * * *"      # 03:00 IST every day: build + upload (private); goes public at 07:00 IST
  workflow_dispatch:
    inputs:
      skip_upload:
        description: "Test run: build the video but do NOT upload"
        type: boolean
        default: false
      private_only:
        description: "Test run: upload as private, no schedule, no notification"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Make the video and schedule it
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAPIER_MCP_TOKEN: ${{ secrets.ZAPIER_MCP_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SKIP_UPLOAD: ${{ inputs.skip_upload && '1' || '0' }}
          PRIVATE_ONLY: ${{ inputs.private_only && '1' || '0' }}
        run: |
          ok=0
          for i in 1 2 3; do
            if python -u generate.py 2>&1 | tee -a run.log; then ok=1; break; fi
            echo "attempt $i failed, retrying in 120 s" | tee -a run.log; sleep 120
          done
          test "$ok" = 1

      - name: Save log, preview and topic history
        if: always()
        run: |
          ffmpeg -y -loglevel error -i out/short.mp4 -vf "fps=1/5,scale=270:480,tile=9x1" -frames:v 1 preview.jpg || true
          git config user.name "trufact-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json run.log preview.jpg || git add history.json run.log
          git diff --cached --quiet || (git commit -m "run log and topic history" && git pull --rebase -q && git push)
